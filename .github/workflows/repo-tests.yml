# Convention tests for workflows, Dockerfiles and build scripts (ADR 0011), run with uv (ADR 0010)
name: Repo tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The CPython version uv downloads (3.14: PyYAML 6.0.3 has no 3.15 wheels yet) and runs the tests with. only-managed stops uv from using a Python already on the runner.
  UV_PYTHON: '3.14'
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  pytest:
    # No docker, so a GitHub-hosted runner: nothing here touches the self-hosted machine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -v --cov --cov-report=term-missing --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

      - name: Lint Python
        run: |
          uv run --with ruff ruff check .
          uv run --with ruff ruff format --check .
