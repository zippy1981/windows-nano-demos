# Builds and tests windows-servercore-vim for every Windows version through the shared workflow (ADR 0009)
name: Vim container

on:
  push:
    branches: [main]
    paths:
      - 'server-core/server-core-vim/**'
      - '.github/workflows/vim-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server-core/server-core-vim/**'
      - '.github/workflows/vim-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: server-core/server-core-vim
      image: windows-servercore-vim
