# Builds and tests windows-nano-php for every Windows version through the shared workflow (ADR 0009)
name: PHP container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server/nano-server-php/**'
      - '.github/workflows/php-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server/nano-server-php/**'
      - '.github/workflows/php-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One leg per PHP release line that PHP still supports (ADR 0005 variants). The newest owns the plain :<win>
        # tags. php-vs is the Visual Studio toolset in the zip's name, which changes between lines, so it is pinned per leg.
        # Add a leg when a line becomes supported, and remove it when PHP ends its security support.
        include:
          - {php-version: '8.5.12-1', php-vs: '17', variant: 'php8.5.12-1', tag-prefix: '8.5.12-1', also-plain-tags: true}
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server/nano-server-php
      image: windows-nano-php
      build-args: '{"PHP_VERSION": "${{ matrix.php-version }}", "PHP_VS_VERSION": "${{ matrix.php-vs }}"}'
      variant: ${{ matrix.variant }}
      tag-prefix: ${{ matrix.tag-prefix }}
      also-plain-tags: ${{ matrix.also-plain-tags }}
