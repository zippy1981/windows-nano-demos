# Builds and tests windows-nano-mysql for ltsc2022 and ltsc2025 through the shared workflow (ADR 0009).
# ltsc2019 is an ADR 0008 exception: see nano-server/nano-server-mysql/README.md.
name: MySQL container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server/nano-server-mysql/**'
      - '.github/workflows/mysql-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server/nano-server-mysql/**'
      - '.github/workflows/mysql-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server/nano-server-mysql
      image: windows-nano-mysql
      # Not ltsc2019: the smoke test's restart check fails intermittently there (WINDOWS_VERSION_EXCEPTIONS in tests/)
      windows-versions: '["2022", "2025"]'
