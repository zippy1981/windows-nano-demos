# Builds and tests windows-nano-combined-tools for every Windows version through the shared workflow (ADR 0009)
name: Combined tools container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server/nano-server-combined-tools/**'
      - '.github/workflows/combined-tools-container.yml'
      - '.github/workflows/build-windows-image.yml'
      - 'nano-server/shared-tools/**'
      - 'nano-server/.dockerignore'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server/nano-server-combined-tools/**'
      - '.github/workflows/combined-tools-container.yml'
      - '.github/workflows/build-windows-image.yml'
      - 'nano-server/shared-tools/**'
      - 'nano-server/.dockerignore'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server/nano-server-combined-tools
      build-context: nano-server
      image: windows-nano-combined-tools
