# Builds and tests windows-nano-powershell-sqlite-odbc for every Windows version through the shared workflow
name: PowerShell SQLite ODBC container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server/nano-server-powershell-sqlite-odbc/**'
      - '.github/workflows/powershell-sqlite-odbc-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server/nano-server-powershell-sqlite-odbc/**'
      - '.github/workflows/powershell-sqlite-odbc-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server/nano-server-powershell-sqlite-odbc
      image: windows-nano-powershell-sqlite-odbc
