# Builds and tests windows-nano-go for the three newest Go releases (issue #20) on every Windows version,
# through the shared workflow (ADR 0009)
name: Go container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server/nano-server-go/**'
      - '.github/workflows/go-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server/nano-server-go/**'
      - '.github/workflows/go-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Keeps the job name "build (1.27.3)" or "build (1.27.3-cgo)": include-only matrices would otherwise list every key
    # (scripts/ci_speed.py reads this name)
    name: build (${{ matrix.go-version }}${{ matrix.cgo == '1' && '-cgo' || '' }})
    strategy:
      fail-fast: false
      matrix:
        # The latest patch of the three newest Go release lines without cgo, plus a cgo variant of the newest
        # (plans/go-cgo.md, ADR 0013). windows-deps-updater bumps these. Each is published as
        # windows-nano-go:<prefix>-<win> (ADR 0005); the newest plain build also owns the plain :<win> tags.
        include:
          - {go-version: '1.27.3', cgo: '0', variant: 'go1.27.3', tag-prefix: '1.27.3', also-plain-tags: true, timeout-minutes: 90}
          - {go-version: '1.26.10', cgo: '0', variant: 'go1.26.10', tag-prefix: '1.26.10', also-plain-tags: false, timeout-minutes: 90}
          - {go-version: '1.25.14', cgo: '0', variant: 'go1.25.14', tag-prefix: '1.25.14', also-plain-tags: false, timeout-minutes: 90}
          # Extracting llvm-mingw takes 10 to 15 minutes under Hyper-V, and the cgo smoke tests build sqlcmd on top
          - {go-version: '1.27.3', cgo: '1', variant: 'go1.27.3-cgo', tag-prefix: '1.27.3-cgo', also-plain-tags: false, timeout-minutes: 150}
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server/nano-server-go
      image: windows-nano-go
      build-args: '{"GO_VERSION": "${{ matrix.go-version }}", "CGO": "${{ matrix.cgo }}"}'
      variant: ${{ matrix.variant }}
      tag-prefix: ${{ matrix.tag-prefix }}
      also-plain-tags: ${{ matrix.also-plain-tags }}
      # The algernon build in smoke-test.ps1 (issue #18) adds a few minutes per version
      timeout-minutes: ${{ matrix.timeout-minutes }}
