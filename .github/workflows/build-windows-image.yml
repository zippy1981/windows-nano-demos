# Shared build-and-test job for every Windows image (ADR 0009).
# Each image's workflow calls this with its folder and image name. image-refresh.yml calls it with pinned bases,
# a subset of Windows versions and publish: true to push to Docker Hub (ADR 0004, 0005, 0006).
name: Build Windows image

on:
  workflow_call:
    inputs:
      context:
        description: Image folder, which is the docker build context and holds smoke-test.ps1
        type: string
        required: true
      image:
        description: Image name, for example windows-nano-php. Published as zippy1981/<image>.
        type: string
        required: true
      windows-versions:
        description: JSON list of Windows versions to build. Images always build all three; image-refresh.yml builds only the ones that changed.
        type: string
        default: '["2019", "2022", "2025"]'
      base-image-overrides:
        description: 'JSON map from Windows version to base image, for versions that need a different base or a pinned digest, e.g. {"2025": "mcr.microsoft.com/windows/servercore:ltsc2025-amd64"}'
        type: string
        default: '{}'
      build-args:
        description: 'JSON map of extra build arguments, for an image that builds several variants, e.g. {"GO_VERSION": "1.26.10"}. WINDOWS_VERSION and BASE_IMAGE are not allowed here; the matrix and base-image-overrides set those.'
        type: string
        default: '{}'
      variant:
        description: Variant name, for example go1.26.10. It goes into the CI image tag so parallel variants don't collide.
        type: string
        default: ''
      tag-prefix:
        description: 'For images published in several variants: published tags become <tag-prefix>-<ver>, <tag-prefix>-<ver>-<os-build> and so on (ADR 0005), for example 1.26.10-2025. Empty publishes the plain <ver> tags.'
        type: string
        default: ''
      also-plain-tags:
        description: With a tag-prefix, also publish the plain <ver> tags. Set it on exactly one variant per image, the one users get from :2025.
        type: boolean
        default: false
      publish:
        description: Push the tested image to Docker Hub. Only takes effect on main (ADR 0006).
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout. A stuck build would otherwise hold a shared runner for 6 hours.
        type: number
        default: 60
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build-and-test:
    # Self-hosted runners have host docker access, so never run code from forks on them (ADR 0003)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, docker]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The Docker Hub secrets live in the "Docker Hub zippy1981" environment. It is only used when publishing from main; other builds use no environment.
    environment: ${{ inputs.publish && github.ref == 'refs/heads/main' && 'Docker Hub zippy1981' || '' }}
    strategy:
      fail-fast: false
      matrix:
        windows-version: ${{ fromJSON(inputs.windows-versions) }}
    env:
      IMAGE: ${{ inputs.image }}:ci-${{ inputs.variant && format('{0}-', inputs.variant) || '' }}${{ matrix.windows-version }}-${{ github.sha }}
      BASE_IMAGE: ${{ fromJSON(inputs.base-image-overrides)[matrix.windows-version] }}
      EXTRA_BUILD_ARGS: ${{ inputs.build-args }}
      # Host tuning (ADR 0020): the repository variable WINDOWS_BUILD_ISOLATION is a JSON map from Windows version to
      # the isolation to build with, for example {"2022": "process", "2025": "process"}. Versions it doesn't name, and
      # every version while it is unset, build with the docker daemon's default.
      BUILD_ISOLATION: ${{ vars.WINDOWS_BUILD_ISOLATION && fromJSON(vars.WINDOWS_BUILD_ISOLATION)[matrix.windows-version] || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # Every published image has its Docker Hub description and overview (dockerfile-docs skill). This builds both
      # without credentials on every run, so missing or oversized documentation fails before anything is published.
      - name: Check Docker Hub documentation
        run: ./scripts/Publish-DockerHubDocs.ps1 -Context '${{ inputs.context }}' -Repository 'zippy1981/${{ inputs.image }}' -WhatIf

      - name: Build (ltsc${{ matrix.windows-version }})
        working-directory: ${{ inputs.context }}
        run: |
          $buildArgs = @('--build-arg', 'WINDOWS_VERSION=${{ matrix.windows-version }}')
          if ($env:BASE_IMAGE) { $buildArgs += @('--build-arg', "BASE_IMAGE=$env:BASE_IMAGE") }
          foreach ($arg in ($env:EXTRA_BUILD_ARGS | ConvertFrom-Json -AsHashtable).GetEnumerator()) {
            if ($arg.Key -in 'WINDOWS_VERSION', 'BASE_IMAGE') { throw "build-args can't set $($arg.Key); the matrix and base-image-overrides own it" }
            $buildArgs += @('--build-arg', "$($arg.Key)=$($arg.Value)")
          }
          # No per-run labels here. They would change the image ID on every run and break layer caching for anything built
          # FROM this image, such as the smoke tests' derived images. The publish step adds the labels.
          # A Hyper-V isolated build container gets 2 processors, and docker build has no option to give it more. A
          # process isolated one gets every processor of the host, but the host must be able to run that Windows
          # version without Hyper-V. So the isolation is a setting of the host, not of the image (ADR 0020).
          $hostArgs = @()
          if ($env:BUILD_ISOLATION) {
            if ($env:BUILD_ISOLATION -notin 'process', 'hyperv') { throw "WINDOWS_BUILD_ISOLATION must map ${{ matrix.windows-version }} to process or hyperv, not '$env:BUILD_ISOLATION'" }
            $hostArgs += "--isolation=$env:BUILD_ISOLATION"
            "Building with $env:BUILD_ISOLATION isolation (WINDOWS_BUILD_ISOLATION)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          # Hyper-V isolated builds default to 1 GB of memory, which hangs large extractions
          docker build --memory 4g @hostArgs @buildArgs -t $env:IMAGE .
          if ($LASTEXITCODE) { throw "docker build failed: $LASTEXITCODE" }

      - name: Smoke test
        # The runner is itself a container, so smoke tests use docker run and docker cp, never bind mounts
        run: ./${{ inputs.context }}/smoke-test.ps1 -Image $env:IMAGE

      - name: Image size
        run: docker image ls $env:IMAGE --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Publish to Docker Hub
        # Only the image that was just tested, only from main, only when the caller asks (ADR 0006)
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if (-not $env:DOCKERHUB_USERNAME -or -not $env:DOCKERHUB_TOKEN) { throw 'DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set in the "Docker Hub zippy1981" environment' }
          # OCI labels: image-refresh.yml compares base.digest and revision with MCR and git to decide what to rebuild.
          # Added in a one-line build on top of the tested image, so the pushed layers are exactly the tested ones.
          $labels = [ordered]@{
            'org.opencontainers.image.revision' = '${{ github.sha }}'
            'org.opencontainers.image.source' = '${{ github.server_url }}/${{ github.repository }}'
            'org.opencontainers.image.created' = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            'org.opencontainers.image.title' = '${{ inputs.image }}'
            # The Dockerfile header's description (dockerfile-docs skill), and where the full documentation lives
            'org.opencontainers.image.description' = (Get-Content -Path '${{ inputs.context }}/Dockerfile' -TotalCount 1) -replace '^# [\w.-]+: ', ''
            'org.opencontainers.image.documentation' = '${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.context }}/README.md'
            'org.opencontainers.image.url' = 'https://hub.docker.com/r/zippy1981/${{ inputs.image }}'
          }
          # Variant images say which variant they are, for example 1.26.10 or 1.27.3-cgo
          if ('${{ inputs.tag-prefix }}') { $labels['org.opencontainers.image.version'] = '${{ inputs.tag-prefix }}' }
          if ($env:BASE_IMAGE) {
            $name, $digest = $env:BASE_IMAGE -split '@', 2
            $labels['org.opencontainers.image.base.name'] = $name
            if ($digest) { $labels['org.opencontainers.image.base.digest'] = $digest }
          }
          $labelArgs = foreach ($label in $labels.GetEnumerator()) { '--label'; "$($label.Key)=$($label.Value)" }
          $labelled = "$env:IMAGE-labelled"
          "FROM $env:IMAGE" | docker build --memory 4g @labelArgs -t $labelled -
          if ($LASTEXITCODE) { throw "labelling failed: $LASTEXITCODE" }

          $version = '${{ matrix.windows-version }}'
          $osBuild = docker image inspect $labelled --format '{{.OsVersion}}'
          $repository = 'zippy1981/${{ inputs.image }}'
          # ADR 0005: moving :<ver>, :<ver>-<os-build> and :<ver>-YYYY-MM, plus an immutable :<ver>-<os-build>-<sha7>.
          # A variant prefixes each of them (:1.26.10-2025 ...); the default variant also gets the plain tags.
          $plain = @(
            $version
            "$version-$osBuild"
            "$version-$((Get-Date).ToUniversalTime().ToString('yyyy-MM'))"
            "$version-$osBuild-$('${{ github.sha }}'.Substring(0, 7))"
          )
          $prefix = '${{ inputs.tag-prefix }}'
          $tags = if ($prefix) { $plain | ForEach-Object { "$prefix-$_" } } else { $plain }
          if ($prefix -and '${{ inputs.also-plain-tags }}' -eq 'true') { $tags = @($tags) + $plain }
          # Runner containers persist between jobs, so the login lives in a throwaway config directory
          $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP "docker-config-$([guid]::NewGuid().ToString('n'))"
          New-Item -ItemType Directory -Path $env:DOCKER_CONFIG | Out-Null
          # Retries transient registry failures. A tag that still fails doesn't stop the remaining tags: every tag is
          # attempted, the failures are listed, and the step fails at the end so the leg (and the refresh issue) shows it.
          function Invoke-WithRetry([string]$What, [scriptblock]$Action, [int]$Attempts = 3) {
            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              # Out-Host: the command's output must not become part of this function's return value
              & $Action | Out-Host
              if (-not $LASTEXITCODE) { return $true }
              Write-Host "::warning::$What failed (attempt $attempt of $Attempts, exit $LASTEXITCODE)"
              if ($attempt -lt $Attempts) { Start-Sleep -Seconds (15 * $attempt) }
            }
            return $false
          }
          $failed = @()
          try {
            $loggedIn = Invoke-WithRetry 'docker login' { $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin }
            if (-not $loggedIn) { throw 'docker login failed after 3 attempts' }
            foreach ($tag in $tags) {
              docker tag $labelled "${repository}:$tag"
              if (Invoke-WithRetry "docker push ${repository}:$tag" { docker push "${repository}:$tag" }) {
                "Pushed ${repository}:$tag" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
              } else {
                $failed += "${repository}:$tag"
                "**Failed** to push ${repository}:$tag" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
              }
            }
            if ($failed) { throw "push failed for $($failed.Count) of $($tags.Count) tags: $($failed -join ', ')" }
            # The repository's short description and overview, from the Dockerfile header and README.md at this commit
            ./scripts/Publish-DockerHubDocs.ps1 -Context '${{ inputs.context }}' -Repository $repository -Revision '${{ github.sha }}' |
              Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          finally {
            docker logout | Out-Null
            Remove-Item -Recurse -Force $env:DOCKER_CONFIG
            foreach ($tag in $tags) { docker rmi --no-prune "${repository}:$tag" 2>$null | Out-Null }
            docker rmi --no-prune $labelled 2>$null | Out-Null
          }

      - name: Cleanup
        if: always()
        run: |
          docker ps -a --filter "ancestor=$env:IMAGE" -q | ForEach-Object { docker rm -f $_ }
          # --no-prune keeps the untagged parent layers, which are the build cache for the next run on this daemon
          docker rmi -f --no-prune $env:IMAGE
          exit 0
