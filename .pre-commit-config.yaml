# Pre-commit hooks: formatting, lint and the convention tests run before every commit.
# Install once per clone:  uv run pre-commit install
# Run by hand:             uv run pre-commit run --all-files
#
# Every hook is local and calls the repo's own uv-managed tools, so no third-party hook repositories are
# downloaded (the same supply-chain stance as ADR 0011's pinned actions). The Python version comes from UV_PYTHON
# when it is set (ADR 0010).
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --with ruff ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run --with ruff ruff check --fix
        language: system
        types: [python]

      - id: markdownlint
        name: markdownlint
        entry: npx -y markdownlint-cli --fix
        language: system
        types: [markdown]

      - id: pytest
        name: pytest (convention and unit tests)
        # The convention tests read workflows, Dockerfiles and build scripts, so run whenever any of them change
        entry: uv run pytest -q --cov
        language: system
        pass_filenames: false
        files: (\.py|\.ya?ml|\.toml|\.json|\.cmd|\.ps1|Dockerfile)$
