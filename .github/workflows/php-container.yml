name: PHP container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server-php/**'
      - '.github/workflows/php-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server-php/**'
      - '.github/workflows/php-container.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    # Self-hosted runners have host docker access, so never run code from forks on them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, docker]
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['2019', '2022', '2025']
    env:
      IMAGE: windows-nano-php:${{ matrix.windows-version }}-${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build --build-arg WINDOWS_VERSION=${{ matrix.windows-version }} -t $env:IMAGE nano-server-php
          if ($LASTEXITCODE) { throw "docker build failed: $LASTEXITCODE" }

      - name: Smoke test
        run: |
          # The image's entrypoint is cmd /S /C, so each call runs through cmd with the user's PATH
          function Invoke-Image {
            $out = docker run --rm $env:IMAGE @args
            $code = $LASTEXITCODE
            Write-Host "> $args"
            $out | Write-Host
            if ($code) { throw "'$args' failed: $code" }
            return $out
          }

          Invoke-Image php -v | Out-Null
          $modules = Invoke-Image php -m
          foreach ($m in 'curl', 'fileinfo', 'openssl', 'zip') {
            if ($modules -notcontains $m) { throw "PHP extension $m is not loaded" }
          }
          $len = Invoke-Image php -r "echo strlen(file_get_contents('https://example.com'));"
          if ([int]($len | Select-Object -Last 1) -le 0) { throw 'TLS fetch returned nothing' }
          Invoke-Image node -v | Out-Null
          Invoke-Image npm -v | Out-Null
          Invoke-Image composer --version | Out-Null
          Invoke-Image laravel --version | Out-Null
          Invoke-Image where micro | Out-Null

      - name: Image size
        run: docker image ls $env:IMAGE --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Remove image
        if: always()
        run: |
          docker rmi -f $env:IMAGE
          exit 0
