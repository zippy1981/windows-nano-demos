# Builds and tests windows-nano-go for the three newest Go releases (issue #20) on every Windows version,
# through the shared workflow (ADR 0009)
name: Go container

on:
  push:
    branches: [main]
    paths:
      - 'nano-server/nano-server-go/**'
      - '.github/workflows/go-container.yml'
      - '.github/workflows/build-windows-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nano-server/nano-server-go/**'
      - '.github/workflows/go-container.yml'
      - '.github/workflows/build-windows-image.yml'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older runs. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The latest patch of the three newest Go release lines. windows-deps-updater bumps these.
        # Each is published as windows-nano-go:<go>-<win> (ADR 0005). The newest also owns the plain :<win> tags.
        include:
          - {go-version: '1.27.3', variant: 'go1.27.3', tag-prefix: '1.27.3', also-plain-tags: true}
          - {go-version: '1.26.10', variant: 'go1.26.10', tag-prefix: '1.26.10', also-plain-tags: false}
          - {go-version: '1.25.14', variant: 'go1.25.14', tag-prefix: '1.25.14', also-plain-tags: false}
    uses: ./.github/workflows/build-windows-image.yml
    with:
      context: nano-server/nano-server-go
      image: windows-nano-go
      build-args: '{"GO_VERSION": "${{ matrix.go-version }}"}'
      variant: ${{ matrix.variant }}
      tag-prefix: ${{ matrix.tag-prefix }}
      also-plain-tags: ${{ matrix.also-plain-tags }}
      # The algernon build in smoke-test.ps1 (issue #18) adds a few minutes per version
      timeout-minutes: 90
